services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8251:8251"
    environment:
      - PORT=8251
      - DATABASE_URL=./homeflix.db
      - MEDIA_PATH=/media/azad/Movies1
      - THUMBNAIL_PATH=./thumbnails
      - LOG_LEVEL=info
    volumes:
      - /media/azad/Movies1:/media/azad/Movies1:ro
      - ./backend/thumbnails:/app/thumbnails
      - ./backend/posters:/app/posters
    restart: unless-stopped
    networks:
      - homeflix-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3006:3006"
    environment:
      - PORT=3006
      - HOSTNAME=0.0.0.0
    volumes: []
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - homeflix-network

networks:
  homeflix-network:
    driver: bridge
