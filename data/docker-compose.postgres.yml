version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: homeflix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: homeflix
      POSTGRES_USER: homeflix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-homeflix_secure_password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=4MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
      -c max_worker_processes=8
      -c max_parallel_workers_per_gather=4
      -c max_parallel_workers=8
      -c max_parallel_maintenance_workers=4
      -c log_min_duration_statement=1000
      -c log_checkpoints=on
      -c log_connections=on
      -c log_disconnections=on
      -c log_lock_waits=on
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homeflix -d homeflix"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - homeflix-network

  redis:
    image: redis:7-alpine
    container_name: homeflix-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --tcp-keepalive 60
      --timeout 300
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - homeflix-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: ${BUILD_TARGET:-production}
    container_name: homeflix-backend
    restart: unless-stopped
    ports:
      - "8251:8251"
    environment:
      - DATABASE_TYPE=postgres
      - DATABASE_URL=postgres://homeflix:${POSTGRES_PASSWORD:-homeflix_secure_password}@postgres:5432/homeflix?sslmode=disable
      - REDIS_URL=redis://redis:6379/0
      - MEDIA_PATH=/media
      - THUMBNAILS_PATH=/app/thumbnails
      - PREVIEWS_PATH=/app/previews
      - POSTERS_PATH=/app/posters
      - SUBTITLES_PATH=/app/subtitles
      - OPTIMIZED_PATH=/app/optimized
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OLLAMA_URL=${OLLAMA_URL:-http://localhost:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.1:8b}
    volumes:
      - ${MEDIA_PATH:-./media}:/media:ro
      - thumbnails_data:/app/thumbnails
      - previews_data:/app/previews
      - posters_data:/app/posters
      - subtitles_data:/app/subtitles
      - optimized_data:/app/optimized
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8251/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - homeflix-network

  # Celery Workers with PostgreSQL
  celery-metadata:
    build:
      context: ./backend
      dockerfile: Dockerfile.celery
    container_name: homeflix-celery-metadata
    restart: unless-stopped
    environment:
      - DATABASE_TYPE=postgres
      - DATABASE_URL=postgres://homeflix:${POSTGRES_PASSWORD:-homeflix_secure_password}@postgres:5432/homeflix?sslmode=disable
      - REDIS_URL=redis://redis:6379/0
      - CELERY_QUEUE=metadata
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OLLAMA_URL=${OLLAMA_URL:-http://localhost:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.1:8b}
    volumes:
      - ${MEDIA_PATH:-./media}:/media:ro
      - ./backend/media.json:/app/media.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - homeflix-network

  celery-thumbnails:
    build:
      context: ./backend
      dockerfile: Dockerfile.celery
    container_name: homeflix-celery-thumbnails
    restart: unless-stopped
    environment:
      - DATABASE_TYPE=postgres
      - DATABASE_URL=postgres://homeflix:${POSTGRES_PASSWORD:-homeflix_secure_password}@postgres:5432/homeflix?sslmode=disable
      - REDIS_URL=redis://redis:6379/0
      - CELERY_QUEUE=thumbnails
    volumes:
      - ${MEDIA_PATH:-./media}:/media:ro
      - thumbnails_data:/app/thumbnails
      - previews_data:/app/previews
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - homeflix-network

  celery-posters:
    build:
      context: ./backend
      dockerfile: Dockerfile.celery
    container_name: homeflix-celery-posters
    restart: unless-stopped
    environment:
      - DATABASE_TYPE=postgres
      - DATABASE_URL=postgres://homeflix:${POSTGRES_PASSWORD:-homeflix_secure_password}@postgres:5432/homeflix?sslmode=disable
      - REDIS_URL=redis://redis:6379/0
      - CELERY_QUEUE=posters
    volumes:
      - posters_data:/app/posters
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - homeflix-network

  celery-video:
    build:
      context: ./backend
      dockerfile: Dockerfile.celery
    container_name: homeflix-celery-video
    restart: unless-stopped
    environment:
      - DATABASE_TYPE=postgres
      - DATABASE_URL=postgres://homeflix:${POSTGRES_PASSWORD:-homeflix_secure_password}@postgres:5432/homeflix?sslmode=disable
      - REDIS_URL=redis://redis:6379/0
      - CELERY_QUEUE=video_processing
    volumes:
      - ${MEDIA_PATH:-./media}:/media:ro
      - optimized_data:/app/optimized
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - homeflix-network

  celery-subtitles:
    build:
      context: ./backend
      dockerfile: Dockerfile.celery
    container_name: homeflix-celery-subtitles
    restart: unless-stopped
    environment:
      - DATABASE_TYPE=postgres
      - DATABASE_URL=postgres://homeflix:${POSTGRES_PASSWORD:-homeflix_secure_password}@postgres:5432/homeflix?sslmode=disable
      - REDIS_URL=redis://redis:6379/0
      - CELERY_QUEUE=subtitles
    volumes:
      - ${MEDIA_PATH:-./media}:/media:ro
      - subtitles_data:/app/subtitles
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - homeflix-network

  celery-scanning:
    build:
      context: ./backend
      dockerfile: Dockerfile.celery
    container_name: homeflix-celery-scanning
    restart: unless-stopped
    environment:
      - DATABASE_TYPE=postgres
      - DATABASE_URL=postgres://homeflix:${POSTGRES_PASSWORD:-homeflix_secure_password}@postgres:5432/homeflix?sslmode=disable
      - REDIS_URL=redis://redis:6379/0
      - CELERY_QUEUE=scanning
    volumes:
      - ${MEDIA_PATH:-./media}:/media:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - homeflix-network

  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile.celery
    container_name: homeflix-flower
    restart: unless-stopped
    ports:
      - "5555:5555"
    environment:
      - REDIS_URL=redis://redis:6379/0
    command: celery -A celery_app flower --port=5555 --broker=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - homeflix-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: ${BUILD_TARGET:-production}
    container_name: homeflix-frontend
    restart: unless-stopped
    ports:
      - "3006:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - NEXT_PUBLIC_API_URL=http://localhost:8251
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - homeflix-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  thumbnails_data:
    driver: local
  previews_data:
    driver: local
  posters_data:
    driver: local
  subtitles_data:
    driver: local
  optimized_data:
    driver: local

networks:
  homeflix-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
