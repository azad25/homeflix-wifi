openapi: 3.0.3
info:
  title: HomeFlix API
  description: |
    A comprehensive Netflix clone API for streaming personal media collections.
    
    Features:
    - Media library management with automatic scanning
    - High-quality video streaming with HLS/DASH support
    - ALAC lossless audio streaming with spatial audio
    - AI-powered metadata generation and recommendations
    - Distributed task processing with Celery
    - Real-time file monitoring and processing
    
    Built with Go backend, Next.js frontend, and modern streaming technologies.
  version: 1.0.0
  contact:
    name: HomeFlix API Support
    url: https://github.com/homeflix/homeflix
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8251/api
    description: Development server
  - url: https://api.homeflix.local/api
    description: Production server

paths:
  # Media Management Endpoints
  /media:
    get:
      tags: [Media]
      summary: Get all media
      description: Retrieve all media items in the library
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: genre
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
            enum: [movie, tv-show, episode]
      responses:
        '200':
          description: List of media items
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Media'
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer

  /media/{id}:
    get:
      tags: [Media]
      summary: Get media by ID
      description: Retrieve a specific media item by UUID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Media item details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Media'
        '404':
          description: Media not found

  /media/movies:
    get:
      tags: [Media]
      summary: Get all movies
      description: Retrieve all movie items
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: genre
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of movies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Media'

  /media/tv-shows:
    get:
      tags: [Media]
      summary: Get all TV shows
      description: Retrieve all TV show series
      responses:
        '200':
          description: List of TV shows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Media'

  /media/trending:
    get:
      tags: [Media]
      summary: Get trending media
      description: Retrieve currently trending media items
      responses:
        '200':
          description: List of trending media
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Media'

  /media/popular:
    get:
      tags: [Media]
      summary: Get popular media
      description: Retrieve popular media items based on view counts
      responses:
        '200':
          description: List of popular media
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Media'

  /media/recent:
    get:
      tags: [Media]
      summary: Get recent media
      description: Retrieve recently added media items
      responses:
        '200':
          description: List of recent media
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Media'

  /search:
    get:
      tags: [Search]
      summary: Search media
      description: Search for media by title, genre, actor, director, etc.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: Search query
        - name: type
          in: query
          schema:
            type: string
            enum: [movie, tv-show, episode]
        - name: genre
          in: query
          schema:
            type: string
        - name: year
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/Media'
                  total:
                    type: integer
                  query:
                    type: string

  /search/advanced:
    get:
      tags: [Search]
      summary: Advanced search
      description: Advanced search with multiple filters
      parameters:
        - name: title
          in: query
          schema:
            type: string
        - name: genre
          in: query
          schema:
            type: string
        - name: year_min
          in: query
          schema:
            type: integer
        - name: year_max
          in: query
          schema:
            type: integer
        - name: rating_min
          in: query
          schema:
            type: number
            format: float
        - name: duration_min
          in: query
          schema:
            type: integer
        - name: duration_max
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Advanced search results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Media'

  # Alias endpoints for backward compatibility
  /movies:
    get:
      tags: [Media]
      summary: Get all movies (alias)
      description: Alias for /media/movies
      responses:
        '200':
          description: List of movies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Media'

  /trending:
    get:
      tags: [Media]
      summary: Get trending media (alias)
      description: Alias for /media/trending
      responses:
        '200':
          description: List of trending media
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Media'

  /popular:
    get:
      tags: [Media]
      summary: Get popular media (alias)
      description: Alias for /media/popular
      responses:
        '200':
          description: List of popular media
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Media'

  /recent:
    get:
      tags: [Media]
      summary: Get recent media (alias)
      description: Alias for /media/recent
      responses:
        '200':
          description: List of recent media
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Media'

  /genre/{genre}:
    get:
      tags: [Media]
      summary: Get media by genre
      description: Retrieve media items filtered by genre
      parameters:
        - name: genre
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Media items in genre
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Media'

  /media/search:
    get:
      tags: [Search]
      summary: Search media (alias)
      description: Alias for /search endpoint
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Media'

  # TV Series and Season Endpoints
  /media/series-with-seasons:
    get:
      tags: [Media]
      summary: Get series with seasons
      description: Get all TV series with their seasons and episodes
      responses:
        '200':
          description: Series with nested seasons
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/Media'
                    - type: object
                      properties:
                        seasons:
                          type: array
                          items:
                            $ref: '#/components/schemas/Season'

  /media/series/{id}/seasons:
    get:
      tags: [Media]
      summary: Get series seasons
      description: Get seasons for specific TV series
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Series with seasons
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Media'
                  - type: object
                    properties:
                      seasons:
                        type: array
                        items:
                          $ref: '#/components/schemas/Season'

  /media/series/{id}/seasons-list:
    get:
      tags: [Media]
      summary: Get seasons list
      description: Get list of seasons for TV series
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of seasons
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Season'

  /media/tv-series-hero:
    get:
      tags: [Media]
      summary: Get TV series for hero section
      description: Get TV series optimized for hero section display
      responses:
        '200':
          description: TV series for hero section
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Media'

  # Streaming Endpoints
  /stream/{id}:
    get:
      tags: [Streaming]
      summary: Stream media content
      description: Stream video content with automatic ALAC audio integration
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: quality
          in: query
          schema:
            type: string
            enum: [auto, 1080p, 720p, 480p, 360p]
            default: auto
        - name: format
          in: query
          schema:
            type: string
            enum: [mp4, hls, dash]
            default: mp4
      responses:
        '200':
          description: Video stream
          content:
            video/mp4:
              schema:
                type: string
                format: binary
            application/vnd.apple.mpegurl:
              schema:
                type: string
                format: binary
            application/dash+xml:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'

  /preview-clips/{id}:
    get:
      tags: [Streaming]
      summary: Stream preview clip
      description: Stream short preview clip for media
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Preview clip stream
          content:
            video/mp4:
              schema:
                type: string
                format: binary

  /media/{id}/alac-audio:
    get:
      tags: [Streaming]
      summary: Stream ALAC audio
      description: Stream high-quality ALAC audio for media
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: ALAC audio stream
          content:
            audio/alac:
              schema:
                type: string
                format: binary

  # Asset Endpoints
  /thumbnails/{id}:
    get:
      tags: [Assets]
      summary: Get thumbnail
      description: Retrieve thumbnail image for media
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: size
          in: query
          schema:
            type: string
            enum: [small, medium, large]
            default: medium
      responses:
        '200':
          description: Thumbnail image
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Assets]
      summary: Generate thumbnail
      description: Generate thumbnail for media (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Thumbnail generation started
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  task_id:
                    type: string

  /posters/{id}:
    get:
      tags: [Assets]
      summary: Get poster
      description: Retrieve poster image for media
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Poster image
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary

  /previews/{id}:
    get:
      tags: [Assets]
      summary: Get preview
      description: Retrieve preview content for media
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Preview content
          content:
            video/mp4:
              schema:
                type: string
                format: binary

  /subtitles/{id}:
    get:
      tags: [Assets]
      summary: Get subtitles
      description: Retrieve subtitle files for media
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: lang
          in: query
          schema:
            type: string
            default: en
      responses:
        '200':
          description: Subtitle file
          content:
            text/vtt:
              schema:
                type: string
            application/x-subrip:
              schema:
                type: string

  # ALAC Audio Endpoints
  /audio/alac/{id}:
    get:
      tags: [ALAC Audio]
      summary: Get ALAC audio
      description: Retrieve high-quality ALAC audio stream
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: ALAC audio stream
          content:
            audio/alac:
              schema:
                type: string
                format: binary

  /audio/alac/{id}/extract:
    post:
      tags: [ALAC Audio]
      summary: Extract ALAC audio
      description: Extract ALAC audio from media file
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: ALAC extraction started
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  task_id:
                    type: string

  /audio/alac/{id}/metadata:
    get:
      tags: [ALAC Audio]
      summary: Get ALAC metadata
      description: Retrieve ALAC audio metadata
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: ALAC metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ALACMetadata'

  /audio/alac/{id}/spatial/{layout}:
    post:
      tags: [ALAC Audio]
      summary: Convert to spatial audio
      description: Convert ALAC audio to spatial audio format
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: layout
          in: path
          required: true
          schema:
            type: string
            enum: [stereo, 5.1, 7.1, 7.1.4, atmos]
      responses:
        '200':
          description: Spatial audio conversion started
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  task_id:
                    type: string

  /audio/formats:
    get:
      tags: [ALAC Audio]
      summary: Get supported audio formats
      description: Retrieve list of supported audio formats
      responses:
        '200':
          description: Supported audio formats
          content:
            application/json:
              schema:
                type: object
                properties:
                  formats:
                    type: array
                    items:
                      type: string
                  codecs:
                    type: array
                    items:
                      type: string

  # Alternative Asset Endpoints
  /assets/thumbnails/{id}:
    get:
      tags: [Assets]
      summary: Get thumbnail (alternative endpoint)
      description: Alternative endpoint for thumbnail retrieval
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Thumbnail image
          content:
            image/jpeg:
              schema:
                type: string
                format: binary

  /assets/previews/{id}:
    get:
      tags: [Assets]
      summary: Get preview (alternative endpoint)
      description: Alternative endpoint for preview retrieval
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Preview content
          content:
            video/mp4:
              schema:
                type: string
                format: binary

  /assets/posters/{id}:
    get:
      tags: [Assets]
      summary: Get poster (alternative endpoint)
      description: Alternative endpoint for poster retrieval
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Poster image
          content:
            image/jpeg:
              schema:
                type: string
                format: binary

  # Additional ALAC Audio Endpoints
  /admin/alac/cleanup-oversized:
    post:
      tags: [ALAC Audio]
      summary: Cleanup oversized audio files
      description: Remove oversized ALAC audio files to free space
      responses:
        '200':
          description: Cleanup started
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  files_removed:
                    type: integer

  /audio/alac/{id}/info:
    get:
      tags: [ALAC Audio]
      summary: Get audio file info
      description: Get detailed information about ALAC audio file
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Audio file information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ALACMetadata'

  # Playback Initialization
  /playback/initialize/{id}:
    post:
      tags: [Playback]
      summary: Initialize playback progress
      description: Initialize playback tracking for media
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Playback initialized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaybackProgress'

  /playback/recently-watched:
    get:
      tags: [Playback]
      summary: Get recently watched (alias)
      description: Alias for /playback/recent
      responses:
        '200':
          description: Recently watched media
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Media'

  # Enhanced Recommendation Endpoints
  /recommendations/unique:
    get:
      tags: [Recommendations]
      summary: Get unique recommendations
      description: Get unique content recommendations
      responses:
        '200':
          description: Unique recommendations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScoredMedia'

  /recommendations/trending:
    get:
      tags: [Recommendations]
      summary: Get trending recommendations
      description: Get smart trending recommendations
      responses:
        '200':
          description: Trending recommendations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScoredMedia'

  /recommendations/popular:
    get:
      tags: [Recommendations]
      summary: Get popular recommendations
      description: Get popular content recommendations
      responses:
        '200':
          description: Popular recommendations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScoredMedia'

  /recommendations/recent:
    get:
      tags: [Recommendations]
      summary: Get recent recommendations
      description: Get recommendations for recent content
      responses:
        '200':
          description: Recent recommendations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScoredMedia'

  /recommendations/top-rated:
    get:
      tags: [Recommendations]
      summary: Get top-rated recommendations
      description: Get high-rated content recommendations
      responses:
        '200':
          description: Top-rated recommendations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScoredMedia'

  /recommendations/genre:
    get:
      tags: [Recommendations]
      summary: Get genre recommendations
      description: Get recommendations by genre
      parameters:
        - name: genre
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Genre-based recommendations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScoredMedia'

  /recommendations/mixed:
    get:
      tags: [Recommendations]
      summary: Get mixed recommendations
      description: Get mixed content recommendations
      responses:
        '200':
          description: Mixed recommendations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScoredMedia'

  /recommendations/personalized:
    get:
      tags: [Recommendations]
      summary: Get personalized recommendations
      description: Get personalized content recommendations
      responses:
        '200':
          description: Personalized recommendations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScoredMedia'

  /recommendations/smart-trending:
    get:
      tags: [Recommendations]
      summary: Get smart trending recommendations
      description: Get enhanced smart trending recommendations
      responses:
        '200':
          description: Smart trending recommendations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScoredMedia'

  # Recommendation Endpoints
  /recommendations:
    get:
      tags: [Recommendations]
      summary: Get recommendations
      description: Get AI-powered content recommendations
      parameters:
        - name: category
          in: query
          schema:
            type: string
            enum: [trending, top_picks, continue_watching, because_you_watched, new_releases]
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: user_id
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of recommendations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScoredMedia'

  /recommendations/similar/{id}:
    get:
      tags: [Recommendations]
      summary: Get similar content
      description: Get content similar to specified media
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Similar content recommendations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScoredMedia'

  /recommendations/continue-watching:
    get:
      tags: [Recommendations]
      summary: Get continue watching
      description: Get content to continue watching
      responses:
        '200':
          description: Continue watching recommendations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Media'

  /recommendations/track-click/{id}:
    post:
      tags: [Recommendations]
      summary: Track recommendation click
      description: Track when user clicks on a recommendation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Click tracked successfully

  # Playback Tracking Endpoints
  /track-view/{id}:
    post:
      tags: [Playback]
      summary: Track media view
      description: Track when media is viewed
      parameters:
        - name: id
          in: path
          required: true
          schema:
