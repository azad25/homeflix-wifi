components:
  schemas:
    Media:
      type: object
      properties:
        id:
          type: integer
          description: Internal database ID
        uuid:
          type: string
          format: uuid
          description: Public UUID identifier
        title:
          type: string
          description: Media title
        original_title:
          type: string
          description: Original title in native language
        description:
          type: string
          description: Plot summary or description
        tagline:
          type: string
          description: Short promotional tagline
        type:
          type: string
          enum: [movie, tv-show, episode]
          description: Media type
        genre:
          type: string
          description: Primary genre
        genres:
          type: array
          items:
            type: string
          description: All genres
        year:
          type: integer
          description: Release year
        release_date:
          type: string
          format: date
          description: Release date
        duration:
          type: integer
          description: Duration in minutes
        rating:
          type: number
          format: float
          description: Rating (0-10)
        imdb_rating:
          type: number
          format: float
          description: IMDb rating
        tmdb_rating:
          type: number
          format: float
          description: TMDB rating
        view_count:
          type: integer
          description: Number of views
        file_path:
          type: string
          description: File system path
        file_size:
          type: integer
          format: int64
          description: File size in bytes
        resolution:
          type: string
          description: Video resolution (e.g., "1920x1080")
        codec:
          type: string
          description: Video codec
        audio_codec:
          type: string
          description: Audio codec
        subtitle_languages:
          type: array
          items:
            type: string
          description: Available subtitle languages
        thumbnail_path:
          type: string
          description: Thumbnail image path
        poster_path:
          type: string
          description: Poster image path
        preview_path:
          type: string
          description: Preview clip path
        backdrop_path:
          type: string
          description: Backdrop image path
        directors:
          type: array
          items:
            type: string
          description: Directors
        actors:
          type: array
          items:
            type: string
          description: Main actors
        writers:
          type: array
          items:
            type: string
          description: Writers
        production_companies:
          type: array
          items:
            type: string
          description: Production companies
        countries:
          type: array
          items:
            type: string
          description: Production countries
        languages:
          type: array
          items:
            type: string
          description: Spoken languages
        series_id:
          type: integer
          description: Parent series ID (for episodes)
        season_id:
          type: integer
          description: Season ID (for episodes)
        season_number:
          type: integer
          description: Season number (for episodes)
        episode_number:
          type: integer
          description: Episode number (for episodes)
        tmdb_id:
          type: integer
          description: TMDB database ID
        imdb_id:
          type: string
          description: IMDb ID
        created_at:
          type: string
          format: date-time
          description: Creation timestamp
        updated_at:
          type: string
          format: date-time
          description: Last update timestamp
      required:
        - uuid
        - title
        - type
        - file_path

    ScoredMedia:
      allOf:
        - $ref: '#/components/schemas/Media'
        - type: object
          properties:
            score:
              type: number
              format: float
              description: Recommendation score (0-1)
            reason:
              type: string
              description: Reason for recommendation

    PlaybackProgress:
      type: object
      properties:
        media_id:
          type: string
          format: uuid
        user_id:
          type: string
        progress:
          type: number
          format: float
          description: Progress percentage (0-1)
        duration:
          type: integer
          description: Total duration in seconds
        current_time:
          type: integer
          description: Current playback time in seconds
        completed:
          type: boolean
        last_watched:
          type: string
          format: date-time
      required:
        - media_id
        - progress

    WatchHistoryEntry:
      type: object
      properties:
        media:
          $ref: '#/components/schemas/Media'
        watched_at:
          type: string
          format: date-time
        progress:
          type: number
          format: float
        completed:
          type: boolean

    WatchStats:
      type: object
      properties:
        total_watch_time:
          type: integer
          description: Total watch time in minutes
        movies_watched:
          type: integer
        episodes_watched:
          type: integer
        favorite_genres:
          type: array
          items:
            type: string
        watch_streak:
          type: integer
          description: Current watch streak in days

    ALACMetadata:
      type: object
      properties:
        format:
          type: string
        sample_rate:
          type: integer
        bit_depth:
          type: integer
        channels:
          type: integer
        duration:
          type: number
          format: float
        file_size:
          type: integer
          format: int64
        spatial_audio:
          type: boolean
        layout:
          type: string
          enum: [stereo, 5.1, 7.1, 7.1.4, atmos]

    Season:
      type: object
      properties:
        id:
          type: integer
        series_id:
          type: integer
        season_number:
          type: integer
        title:
          type: string
        description:
          type: string
        release_date:
          type: string
          format: date
        episode_count:
          type: integer
        episodes:
          type: array
          items:
            $ref: '#/components/schemas/Media'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    QueueStatus:
      type: object
      properties:
        name:
          type: string
          description: Queue name
        length:
          type: integer
          description: Number of pending tasks
        workers:
          type: integer
          description: Number of active workers
        processed:
          type: integer
          description: Total processed tasks
        failed:
          type: integer
          description: Total failed tasks
        last_activity:
          type: string
          format: date-time
          description: Last queue activity

    TaskResult:
      type: object
      properties:
        task_id:
          type: string
        status:
          type: string
          enum: [pending, started, success, failure, retry, revoked]
        result:
          type: object
        error:
          type: string
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time

    Genre:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        media_count:
          type: integer
        created_at:
          type: string
          format: date-time

    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message
        code:
          type: integer
          description: Error code
        details:
          type: string
          description: Additional error details

  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

